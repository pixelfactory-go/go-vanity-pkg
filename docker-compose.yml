version: '3.8'

services:
  go-vanity-pkg:
    build:
      context: .
      dockerfile: Dockerfile
    image: go-vanity-pkg:latest
    container_name: go-vanity-pkg
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - vanity-network

networks:
  vanity-network:
    driver: bridge
